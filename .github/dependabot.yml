version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      kotlin-and-compose:
        patterns: ["org.jetbrains.kotlin*", "androidx.compose*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
